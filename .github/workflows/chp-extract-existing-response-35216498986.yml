name: CHP Extract Existing Provider Final Response 35216498986

on:
  push:
    branches:
      - chp-live-provider-20260917
    paths:
      - .github/workflows/chp-extract-existing-response-35216498986.yml

permissions:
  contents: write

jobs:
  extract-final-response:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Generate one-time extraction public key
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/extract_private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/extract_private.pem -pubout -out /tmp/extract_public.pem >/dev/null 2>&1
          base64 -w0 /tmp/extract_public.pem > /tmp/pub.b64
          base64 -w0 /tmp/pub.b64 > /tmp/content.b64
          jq -n --arg message "chp: publish response extractor public key ${GITHUB_RUN_ID}" --rawfile content /tmp/content.b64 --arg branch "$GITHUB_REF_NAME" '{message:$message,content:$content,branch:$branch}' > /tmp/upload.json
          curl -fsSL -X PUT -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/.chp-extract/pubkey-${GITHUB_RUN_ID}.b64" --data-binary @/tmp/upload.json >/dev/null
          echo "CHP_EXTRACT_PUBKEY=.chp-extract/pubkey-${GITHUB_RUN_ID}.b64"

      - name: Extract encrypted final response and re-encrypt compact result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          trap 'rm -f /tmp/extract_private.pem /tmp/extract_public.pem /tmp/pub.b64 /tmp/content.b64 /tmp/upload.json /tmp/session.b64 /tmp/session.bin /tmp/session.json /tmp/old.pass /tmp/result.pass /tmp/source.b64 /tmp/source.enc /tmp/wire.json /tmp/raw.sse /tmp/final.json /tmp/final.enc /tmp/final.b64 /tmp/chunk-* /tmp/manifest.txt' EXIT
          SESSION_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/.chp-extract/session-${GITHUB_RUN_ID}.b64"
          found=0
          for i in $(seq 1 240); do
            if curl -fsSL --connect-timeout 5 "${SESSION_URL}?nonce=${GITHUB_RUN_ID}-${i}" -o /tmp/session.b64 2>/dev/null && [ -s /tmp/session.b64 ]; then found=1; break; fi
            sleep 3
          done
          if [ "$found" -ne 1 ]; then echo 'CHP_EXTRACT_ERROR=SESSION_NOT_RECEIVED'; exit 42; fi
          base64 -d /tmp/session.b64 > /tmp/session.bin
          openssl pkeyutl -decrypt -inkey /tmp/extract_private.pem -in /tmp/session.bin -out /tmp/session.json -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          jq -e '.old_session_pass and .result_pass' /tmp/session.json >/dev/null
          jq -r '.old_session_pass' /tmp/session.json > /tmp/old.pass
          jq -r '.result_pass' /tmp/session.json > /tmp/result.pass
          chmod 600 /tmp/old.pass /tmp/result.pass
          SRC_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/.chp-relay/response-35216498986-0001.b64"
          curl -fsSL "$SRC_URL?nonce=${GITHUB_RUN_ID}" -o /tmp/source.b64
          base64 -d /tmp/source.b64 > /tmp/source.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass file:/tmp/old.pass -in /tmp/source.enc -out /tmp/wire.json
          jq -e '.schema=="chp.encrypted-provider-wire.v1" and .http_code==200 and .body_b64' /tmp/wire.json >/dev/null
          jq -r '.body_b64' /tmp/wire.json | base64 -d > /tmp/raw.sse
          python3 - <<'PY'
          import json, pathlib
          raw=pathlib.Path('/tmp/raw.sse').read_text('utf-8',errors='strict')
          found=[]
          for block in raw.replace('\r\n','\n').split('\n\n'):
              if not block.strip(): continue
              event=''
              data=[]
              for line in block.split('\n'):
                  if line.startswith('event:'): event=line[6:].strip()
                  elif line.startswith('data:'): data.append(line[5:].lstrip())
              if event=='response.completed' and data:
                  obj=json.loads('\n'.join(data))
                  resp=obj.get('response') if isinstance(obj,dict) else None
                  if isinstance(resp,dict): found.append(resp)
          if not found:
              raise SystemExit('CHP_EXTRACT_NO_RESPONSE_COMPLETED')
          resp=found[-1]
          if resp.get('status')!='completed':
              raise SystemExit('CHP_EXTRACT_FINAL_NOT_COMPLETED')
          pathlib.Path('/tmp/final.json').write_text(json.dumps(resp,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          print('CHP_EXTRACT_FINAL_OK', 'model='+str(resp.get('model','')), 'bytes='+str(pathlib.Path('/tmp/final.json').stat().st_size), 'output_items='+str(len(resp.get('output') or [])))
          PY
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass file:/tmp/result.pass -in /tmp/final.json -out /tmp/final.enc
          base64 -w0 /tmp/final.enc > /tmp/final.b64
          split -b 40000 -d -a 4 /tmp/final.b64 /tmp/chunk-
          : > /tmp/manifest.txt
          COUNT=0
          for P in /tmp/chunk-*; do
            COUNT=$((COUNT+1)); printf '%s %s %s\n' "$(basename "$P")" "$(wc -c < "$P")" "$(sha256sum "$P" | awk '{print $1}')" >> /tmp/manifest.txt
          done
          printf 'source_final_json_bytes %s\nsource_final_json_sha256 %s\nencrypted_b64_bytes %s\nencrypted_b64_sha256 %s\npart_count %s\n' "$(wc -c < /tmp/final.json)" "$(sha256sum /tmp/final.json | awk '{print $1}')" "$(wc -c < /tmp/final.b64)" "$(sha256sum /tmp/final.b64 | awk '{print $1}')" "$COUNT" >> /tmp/manifest.txt
          BASE=".chp-extract/result-${GITHUB_RUN_ID}"
          N=0
          for P in /tmp/chunk-*; do
            N=$((N+1)); PAD=$(printf '%04d' "$N")
            base64 -w0 "$P" > /tmp/content.b64
            jq -n --arg message "chp: extracted final response chunk ${GITHUB_RUN_ID}-${PAD}" --rawfile content /tmp/content.b64 --arg branch "$GITHUB_REF_NAME" '{message:$message,content:$content,branch:$branch}' > /tmp/upload.json
            curl -fsSL -X PUT -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${BASE}/part-${PAD}.txt" --data-binary @/tmp/upload.json >/dev/null
          done
          base64 -w0 /tmp/manifest.txt > /tmp/content.b64
          jq -n --arg message "chp: extracted final response manifest ${GITHUB_RUN_ID}" --rawfile content /tmp/content.b64 --arg branch "$GITHUB_REF_NAME" '{message:$message,content:$content,branch:$branch}' > /tmp/upload.json
          curl -fsSL -X PUT -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${BASE}/manifest.txt" --data-binary @/tmp/upload.json >/dev/null
          echo "CHP_EXTRACT_RESULT=PASS PARTS=${COUNT}"
