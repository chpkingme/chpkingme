name: CHP Encrypted Live Provider Relay

on:
  push:
    branches:
      - chp-live-provider-20260917
    paths:
      - .github/workflows/chp-live-provider-probe.yml

permissions:
  contents: write

jobs:
  encrypted-provider-relay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Generate and publish one-time relay public key
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/chp_relay_private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/chp_relay_private.pem -pubout -out /tmp/chp_relay_public.pem >/dev/null 2>&1
          PUB_B64="$(base64 -w0 /tmp/chp_relay_public.pem)"
          CONTENT="$(printf '%s' "$PUB_B64" | base64 -w0)"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/.chp-relay/pubkey-${GITHUB_RUN_ID}.b64"
          curl -fsSL -X PUT -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$API" -d "{\"message\":\"chp: publish encrypted relay public key ${GITHUB_RUN_ID}\",\"content\":\"${CONTENT}\",\"branch\":\"${GITHUB_REF_NAME}\"}" >/dev/null
          echo "CHP_RELAY_PUBLIC_KEY=.chp-relay/pubkey-${GITHUB_RUN_ID}.b64"

      - name: Run encrypted Ark Responses relay
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARK_URL: https://ark.cn-beijing.volces.com/api/plan/v3/responses
        run: |
          set -euo pipefail
          trap 'rm -f /tmp/chp_relay_private.pem /tmp/chp_relay_public.pem /tmp/session.b64 /tmp/session.bin /tmp/session.json /tmp/session.pass /tmp/apikey.txt /tmp/request.b64 /tmp/request.enc /tmp/request.json /tmp/response.raw /tmp/headers.txt /tmp/body.b64 /tmp/response.json /tmp/response.enc /tmp/response.b64 /tmp/github-content.b64 /tmp/upload.json /tmp/stop.txt' EXIT
          SESSION_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/.chp-relay/session-${GITHUB_RUN_ID}.b64"
          found=0
          for i in $(seq 1 240); do
            if curl -fsSL --connect-timeout 5 "${SESSION_URL}?nonce=${GITHUB_RUN_ID}-${i}" -o /tmp/session.b64 2>/dev/null && [ -s /tmp/session.b64 ]; then found=1; break; fi
            sleep 3
          done
          if [ "$found" -ne 1 ]; then echo 'CHP_RELAY_ERROR=SESSION_NOT_RECEIVED'; exit 42; fi
          base64 -d /tmp/session.b64 > /tmp/session.bin
          openssl pkeyutl -decrypt -inkey /tmp/chp_relay_private.pem -in /tmp/session.bin -out /tmp/session.json -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          jq -e '.api_key and .session_pass' /tmp/session.json >/dev/null
          jq -r '.api_key' /tmp/session.json > /tmp/apikey.txt
          jq -r '.session_pass' /tmp/session.json > /tmp/session.pass
          chmod 600 /tmp/apikey.txt /tmp/session.pass
          API_KEY="$(cat /tmp/apikey.txt)"
          echo "::add-mask::${API_KEY}"
          echo 'CHP_RELAY_STATE=READY'
          seq=1
          idle=0
          while [ "$seq" -le 80 ]; do
            PAD=$(printf '%04d' "$seq")
            STOP_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/.chp-relay/stop-${GITHUB_RUN_ID}.txt"
            if curl -fsSL --connect-timeout 3 "${STOP_URL}?nonce=${seq}" -o /tmp/stop.txt 2>/dev/null; then echo 'CHP_RELAY_STATE=STOP_REQUESTED'; break; fi
            REQ_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/.chp-relay/request-${GITHUB_RUN_ID}-${PAD}.b64"
            if ! curl -fsSL --connect-timeout 5 "${REQ_URL}?nonce=${GITHUB_RUN_ID}-${PAD}-${idle}" -o /tmp/request.b64 2>/dev/null; then
              idle=$((idle+1)); if [ "$idle" -gt 1200 ]; then echo 'CHP_RELAY_STATE=IDLE_TIMEOUT'; exit 43; fi; sleep 3; continue
            fi
            idle=0
            base64 -d /tmp/request.b64 > /tmp/request.enc
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass file:/tmp/session.pass -in /tmp/request.enc -out /tmp/request.json
            jq -e 'type=="object" and .model' /tmp/request.json >/dev/null
            set +e
            HTTP_CODE=$(curl -sS --connect-timeout 20 --max-time 1800 -D /tmp/headers.txt -o /tmp/response.raw -w '%{http_code}' -H "Authorization: Bearer ${API_KEY}" -H 'Content-Type: application/json' --data-binary @/tmp/request.json "$ARK_URL")
            CURL_RC=$?
            set -e
            CONTENT_TYPE=$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{sub(/\r$/,""); sub(/^[^:]+:[[:space:]]*/,""); v=$0} END{print v}' /tmp/headers.txt)
            base64 -w0 /tmp/response.raw > /tmp/body.b64
            jq -n --arg seq "$PAD" --arg ct "$CONTENT_TYPE" --rawfile body /tmp/body.b64 --argjson rc "$CURL_RC" --argjson code "${HTTP_CODE:-0}" '{schema:"chp.encrypted-provider-wire.v1",seq:$seq,curl_rc:$rc,http_code:$code,content_type:$ct,body_b64:$body}' > /tmp/response.json
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass file:/tmp/session.pass -in /tmp/response.json -out /tmp/response.enc
            base64 -w0 /tmp/response.enc > /tmp/response.b64
            base64 -w0 /tmp/response.b64 > /tmp/github-content.b64
            API="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/.chp-relay/response-${GITHUB_RUN_ID}-${PAD}.b64"
            MSG="chp: encrypted provider response ${GITHUB_RUN_ID}-${PAD}"
            jq -n --arg message "$MSG" --rawfile content /tmp/github-content.b64 --arg branch "$GITHUB_REF_NAME" '{message:$message,content:$content,branch:$branch}' > /tmp/upload.json
            curl -fsSL -X PUT -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$API" --data-binary @/tmp/upload.json >/dev/null
            echo "CHP_RELAY_RESPONSE=${PAD} HTTP=${HTTP_CODE} CURL=${CURL_RC} RAW_BYTES=$(wc -c < /tmp/response.raw)"
            seq=$((seq+1))
          done
          echo 'CHP_RELAY_STATE=FINISHED'
