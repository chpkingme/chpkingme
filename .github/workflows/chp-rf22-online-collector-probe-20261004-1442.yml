name: CHP RF22 Online Collector Probe 20261004 1442

on:
  push:
    branches:
      - chp-live-provider-20260917
    paths:
      - .github/workflows/chp-rf22-online-collector-probe-20261004-1442.yml

permissions:
  contents: write

jobs:
  rf22-online-collector-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Publish one-time RSA public key
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_ID: rf22-online-20261004-1442
        run: |
          set -euo pipefail
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/chp_private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/chp_private.pem -pubout -out /tmp/chp_public.pem >/dev/null 2>&1
          PUB_B64="$(base64 -w0 /tmp/chp_public.pem)"
          CONTENT="$(printf '%s' "$PUB_B64" | base64 -w0)"
          PATH_KEY=".chp-rf22-nettest/${TEST_ID}/pubkey.b64"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${PATH_KEY}"
          jq -n --arg message "chp: rf22 nettest public key ${TEST_ID}" --arg content "$CONTENT" --arg branch "$GITHUB_REF_NAME" '{message:$message,content:$content,branch:$branch}' > /tmp/upload.json
          curl -fsSL -X PUT -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$API" --data-binary @/tmp/upload.json >/dev/null
          echo "CHP_RF22_NETTEST_PUBLIC_KEY=${PATH_KEY}"

      - name: Wait, decrypt, and run RF22 production collector
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_ID: rf22-online-20261004-1442
        run: |
          set -euo pipefail
          cleanup(){ rm -rf /tmp/rf22-nettest /tmp/chp_private.pem /tmp/chp_public.pem /tmp/session.b64 /tmp/session.bin /tmp/session.json /tmp/bundle.pass /tmp/manifest.json /tmp/bundle.b64 /tmp/bundle.enc /tmp/bundle.tar.gz /tmp/result.json /tmp/result.enc /tmp/result.b64 /tmp/github-content.b64 /tmp/upload.json; }
          trap cleanup EXIT
          mkdir -p /tmp/rf22-nettest
          BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/.chp-rf22-nettest/${TEST_ID}"
          found=0
          for i in $(seq 1 360); do
            if curl -fsSL --connect-timeout 5 "${BASE}/session.b64?nonce=${i}" -o /tmp/session.b64 2>/dev/null \
              && [ -s /tmp/session.b64 ] \
              && curl -fsSL --connect-timeout 5 "${BASE}/manifest.json?nonce=${i}" -o /tmp/manifest.json 2>/dev/null \
              && [ -s /tmp/manifest.json ] \
              && curl -fsSL --connect-timeout 5 "${BASE}/bundle.enc.b64?nonce=${i}" -o /tmp/bundle.b64 2>/dev/null \
              && [ -s /tmp/bundle.b64 ]; then found=1; break; fi
            sleep 3
          done
          if [ "$found" -ne 1 ]; then echo 'CHP_RF22_NETTEST=INPUT_NOT_RECEIVED'; exit 42; fi
          base64 -d /tmp/session.b64 > /tmp/session.bin
          openssl pkeyutl -decrypt -inkey /tmp/chp_private.pem -in /tmp/session.bin -out /tmp/session.json -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          jq -e '.bundle_pass and .bundle_sha256' /tmp/session.json >/dev/null
          jq -r '.bundle_pass' /tmp/session.json > /tmp/bundle.pass
          EXPECTED="$(jq -r '.bundle_sha256' /tmp/session.json)"
          MANIFEST_SHA="$(jq -r '.bundle_sha256' /tmp/manifest.json)"
          if [ "$EXPECTED" != "$MANIFEST_SHA" ]; then echo 'CHP_RF22_NETTEST=MANIFEST_SHA_MISMATCH'; exit 43; fi
          base64 -d /tmp/bundle.b64 > /tmp/bundle.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass file:/tmp/bundle.pass -in /tmp/bundle.enc -out /tmp/bundle.tar.gz
          ACTUAL="$(sha256sum /tmp/bundle.tar.gz | awk '{print $1}')"
          if [ "$ACTUAL" != "$EXPECTED" ]; then echo 'CHP_RF22_NETTEST=BUNDLE_SHA_MISMATCH'; exit 44; fi
          tar -xzf /tmp/bundle.tar.gz -C /tmp/rf22-nettest
          set +e
          CHP_RESULT_PATH=/tmp/result.json node /tmp/rf22-nettest/runner.js > /tmp/rf22-nettest/runner.log 2>&1
          RC=$?
          set -e
          if [ ! -s /tmp/result.json ]; then jq -n --argjson rc "$RC" --rawfile log /tmp/rf22-nettest/runner.log '{schema:"chp.rf22.github-online-collector-probe.v1",fatal:{code:"RESULT_MISSING",runner_rc:$rc,log:$log}}' > /tmp/result.json; fi
          jq --argjson runner_rc "$RC" --rawfile runner_log /tmp/rf22-nettest/runner.log '. + {github:{runner_rc:$runner_rc,runner_log:$runner_log}}' /tmp/result.json > /tmp/result2.json
          mv /tmp/result2.json /tmp/result.json
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass file:/tmp/bundle.pass -in /tmp/result.json -out /tmp/result.enc
          base64 -w0 /tmp/result.enc > /tmp/result.b64
          base64 -w0 /tmp/result.b64 > /tmp/github-content.b64
          PATH_RESULT=".chp-rf22-nettest/${TEST_ID}/result.b64"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${PATH_RESULT}"
          jq -n --arg message "chp: rf22 nettest result ${TEST_ID}" --rawfile content /tmp/github-content.b64 --arg branch "$GITHUB_REF_NAME" '{message:$message,content:$content,branch:$branch}' > /tmp/upload.json
          curl -fsSL -X PUT -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$API" --data-binary @/tmp/upload.json >/dev/null
          echo "CHP_RF22_NETTEST_RESULT=${PATH_RESULT}"
          echo "CHP_RF22_NETTEST_RUNNER_RC=${RC}"
          if [ "$RC" -ne 0 ]; then exit "$RC"; fi
          echo 'CHP_RF22_NETTEST=PASS'
