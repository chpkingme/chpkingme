name: RF22 public source probe

on:
  push:
    branches:
      - chp-live-provider-20260917
    paths:
      - rf22-netprobe.sh
      - .github/workflows/rf22-netprobe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run probe
        shell: bash
        run: bash rf22-netprobe.sh
      - name: Publish result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CONTENT="$(base64 -w0 rf22-public-source-reachability.csv)"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/.chp-rf22-nettest/rf22-public-source-reachability.csv"
          jq -n --arg message "chp: RF22 public source probe result" --arg content "$CONTENT" --arg branch "$GITHUB_REF_NAME" '{message:$message,content:$content,branch:$branch}' > /tmp/upload.json
          curl -fsSL -X PUT -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$API" --data-binary @/tmp/upload.json >/dev/null
          echo 'CHP_RF22_SOURCE_PROBE_RESULT_WRITTEN'
